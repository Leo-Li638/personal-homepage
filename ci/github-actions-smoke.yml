name: smoke

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: test-results/smoke
          if-no-files-found: ignore
